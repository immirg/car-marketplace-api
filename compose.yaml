services:
  mysql:
    image: mysql:8.4
    container_name: car-marketplace-db
    environment:
      MYSQL_DATABASE: securityJWTdb
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: car-marketplace-app
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/securityJWTdb?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: